<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SHOP</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Лучшие товары</h1>
      <ul class="cards">
        <ol>
          <article class="card">
            <picture class="card__img-container">
              <img class="card__img" src="./assets/img-1.jpg" alt="" />
            </picture>
            <div class="card__content">
              <p class="card__price">9 990 ₽</p>
              <h2 class="card__title">GAZELLE</h2>
              <p class="card__subtitle">adidas Originals</p>
            </div>
          </article>
        </ol>
        <ol>
          <article class="card">
            <picture class="card__img-container">
              <img class="card__img" src="./assets/img-2.jpg" alt="" />
            </picture>
            <div class="card__content">
              <p class="card__price">14 990 ₽</p>
              <h2 class="card__title">X-race</h2>
              <p class="card__subtitle">New Balance</p>
            </div>
          </article>
        </ol>
        <ol>
          <article class="card">
            <picture class="card__img-container">
              <img class="card__img" src="./assets/img-3.jpg" alt="" />
            </picture>
            <div class="card__content">
              <p class="card__price">16 990 ₽</p>
              <h2 class="card__title">GAZELLE</h2>
              <p class="card__subtitle">Jordan</p>
            </div>
          </article>
        </ol>
      </ul>
    </div>
  </body>
</html>
