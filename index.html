<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Top Destinations</title>
  </head>
  <body class="body">
    <header class="header">
      <h1 class="title">Top Destinations</h1>
      <p class="subtitle">
        Sost Brilliant reasons Entrada should be your one-stop-shop!
      </p>
    </header>
    <main class="container">
      <ul class="cards">
        <li class="card card_1">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-1.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">Vietnam</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
        <li class="card card_2">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-2.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">Old Rain</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
        <li class="card card_3">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-3.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">Greece</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
        <li class="card card_4">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-4.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">London</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
        <li class="card card_5">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-5.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">Amsterdam</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
        <li class="card card_6">
          <div class="overlay"></div>
          <img class="card__img" src="./assets/img-6.png" alt="" />
          <div class="card__content">
            <h3 class="card__title">Paris</h3>
            <p class="card__subtitle">Waterfall</p>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
