<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>FLEX-FORM</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <h1 class="header__logo">Flexbox</h1>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">About</li>
            <li class="header__nav-item">Works</li>
            <li class="header__nav-item">Blog</li>
          </ul>
        </nav>
        <button class="button">Contact</button>
      </div>
    </header>
    <main class="container">
      <div class="form">
        <h3 class="form__title">Sign in to accout</h3>
        <form class="form__body" action="">
          <input class="form__input" placeholder="Email" type="email" />
          <input class="form__input" placeholder="Password" type="password" />
          <span class="form__description">Forgot email or password?</span>
          <button class="form__button button">Sigh in</button>
        </form>
      </div>
    </main>
  </body>
</html>
